# Preenchido pelo Maven (pom.xml, recurso filtrado) a cada build. Lido por com.nekkora.client.BuildInfo.
# Nao editar valores aqui: a versao vem de <version> do pom.xml e o ano, do relogio do build.
version=${project.version}
# ano em que este build foi feito (UTC); muda sozinho a cada build
year=${build.year}
# commit da pasta de trabalho, gravado pelo tools/package-windows.ps1; num build comum fica "nao-informado"
commit=${client.build.commit}
commitShort=${client.build.commitShort}
dirty=${client.build.dirty}
